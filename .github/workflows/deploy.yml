name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verificar app (smoke)
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Configurar Pages
        uses: actions/configure-pages@v6
        with:
          # Intenta habilitar Pages con el token del workflow si aún no está activo
          enablement: true

      # Artefacto = contenido público del repo (private/ está gitignored y no existe en el checkout de CI)
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
